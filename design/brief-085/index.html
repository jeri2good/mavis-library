<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>BRIEF-085 — Mavis Library Listen redesign</title>
<style>
@font-face{font-family:Fraunces;src:url(fonts/fraunces_variable.ttf);font-weight:100 900}
@font-face{font-family:Literata;src:url(fonts/literata_variable.ttf);font-weight:200 900}
/* Dark warm "library": walnut and lamplight. Same roles as the app's Material colour scheme. */
:root{--bg:#1c1410;--on:#f2e7d6;--muted:#bcab96;--faint:#8f7f6c;--card:#2a1f18;--card2:#352820;--line:#4a3a2d;
--primary:#e0a56f;--onprimary:#2c1507;--tonal:#4a3322;--ontonal:#f6d9bd;--chip:#544c2c;--onchip:#efe8c0;--nav:#241a14;--sheet:#261c15;--scrim:rgba(8,5,3,.62);--meter:#e0a56f;--track:#4a3a2d}
/* Paper = the app's existing theme (Theme.kt PaperColors), used only for the comparison renders. */
.paper{--bg:#f6efe2;--on:#2a211a;--muted:#51463a;--faint:#84766a;--card:#f1e8d8;--card2:#e5dac6;--line:#d6c8b5;
--primary:#7a3e1d;--onprimary:#fff;--tonal:#f3d9c4;--ontonal:#2e1406;--chip:#e8e2be;--onchip:#1d1b05;--nav:#f1e8d8;--sheet:#f9f2e6;--scrim:rgba(42,33,26,.45);--meter:#7a3e1d;--track:#e8e2be}
*{box-sizing:border-box;margin:0}
body{background:#100b08;color:#f2e7d6;font-family:Literata,serif;padding:32px}
.paper body,body.paper{background:#d9cfbd;color:#2a211a}
.intro{margin-bottom:28px;max-width:760px}.intro h1{font:600 28px Fraunces,serif}.intro p{font-size:14px;margin-top:6px;opacity:.75}
.wall{display:flex;gap:36px;width:max-content}
figure figcaption{font:600 14px Literata,serif;margin-bottom:10px;opacity:.85}
.phone{position:relative;width:390px;height:844px;overflow:hidden;background:var(--bg);color:var(--on);font-family:Literata,serif;font-size:14px;line-height:1.35;border-radius:26px;box-shadow:0 18px 50px rgba(0,0,0,.55)}
body.solo{padding:0;background:var(--bg)}body.solo .intro,body.solo figcaption{display:none}body.solo .wall{display:block}body.solo figure{display:none}body.solo figure.on{display:block}body.solo .phone{border-radius:0;box-shadow:none}
svg{display:block}.ic{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.status{height:36px;padding:10px 22px 0;display:flex;justify-content:space-between;font-size:13px;color:var(--muted);font-family:Arial,sans-serif}
.status .r{display:flex;gap:6px;align-items:center}
.body{position:absolute;top:36px;left:0;right:0;bottom:88px;padding:0 16px;overflow:hidden}
.body.full{bottom:18px}
h1.t{font:600 30px/1.15 Fraunces,serif}h2.s{font:600 19px/1.2 Fraunces,serif}
.sub{color:var(--muted);font-size:12.5px}.small{font-size:12px;color:var(--muted)}
.row{display:flex;align-items:center;gap:10px}.grow{flex:1;min-width:0}.clip{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.nav{position:absolute;left:0;right:0;bottom:0;height:88px;background:var(--nav);display:flex;padding:9px 2px 0;justify-content:space-around}
.nav div{width:62px;text-align:center;font-size:11.5px;color:var(--muted);font-weight:500}.nav i{display:flex;justify-content:center;width:56px;height:30px;margin:0 auto 3px;align-items:center;border-radius:15px}
.nav .on{color:var(--on);font-weight:700}.nav .on i{background:var(--chip);color:var(--onchip)}
.gest{position:absolute;bottom:7px;left:50%;width:100px;height:4px;margin-left:-50px;border-radius:2px;background:var(--muted);opacity:.8;z-index:9}
.chip{display:inline-flex;align-items:center;height:32px;padding:0 13px;border:1px solid var(--faint);border-radius:8px;font-weight:600;font-size:13px;color:var(--muted);white-space:nowrap}
.chip.on{background:var(--chip);border-color:transparent;color:var(--onchip)}
.btn{display:flex;align-items:center;justify-content:center;gap:8px;height:48px;border-radius:24px;background:var(--primary);color:var(--onprimary);font-weight:700;font-size:15px}
.btn.tonal{background:var(--tonal);color:var(--ontonal)}.btn.sm{height:36px;padding:0 14px;font-size:13px;border-radius:18px}
.btn.line{background:none;border:1px solid var(--faint);color:var(--on)}
.play{width:40px;height:40px;flex:none;border-radius:50%;background:var(--tonal);color:var(--ontonal);display:flex;align-items:center;justify-content:center}.play svg{fill:currentColor;width:18px;height:18px;margin-left:2px}
.fab{position:absolute;right:16px;bottom:102px;height:54px;padding:0 20px 0 16px;border-radius:17px;background:var(--primary);color:var(--onprimary);font-weight:700;font-size:16px;display:flex;align-items:center;gap:8px;box-shadow:0 8px 18px rgba(0,0,0,.45);z-index:3}
.card{background:var(--card);border-radius:12px;padding:12px}.card.out{border:1px solid var(--line);background:transparent}
.link{color:var(--primary);font-weight:700}
.tag{font-size:10.5px;letter-spacing:.09em;text-transform:uppercase;font-weight:700;color:var(--primary)}

/* Record crate */
.vinyl{position:relative;border-radius:50%;background:radial-gradient(circle at 50% 50%,transparent 0 36%,rgba(255,255,255,.05) 36.4%,transparent 37%),repeating-radial-gradient(circle at 50% 50%,#0d0d0e 0 1.5px,#1b1b1d 1.5px 3px);box-shadow:0 10px 22px rgba(0,0,0,.55);flex:none;overflow:hidden}
.vinyl:before{content:"";position:absolute;inset:0;border-radius:50%;background:conic-gradient(from 25deg,rgba(255,255,255,0) 0 8%,rgba(255,255,255,.13) 13%,rgba(255,255,255,0) 19% 55%,rgba(255,255,255,.1) 62%,rgba(255,255,255,0) 68%)}
.vinyl .lab{position:absolute;inset:30%;border-radius:50%;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;color:#20122b;background:radial-gradient(circle at 40% 35%,#d691ea,#9c4bbd 75%)}
.vinyl .lab b{font:700 10px/1.1 Literata,serif;padding:0 8px}.vinyl .lab u{display:block;width:6px;height:6px;border-radius:50%;background:#0a0a0a;margin:5px 0 4px}.vinyl .lab span{font:9px Arial,sans-serif}
.vinyl.g .lab{background:radial-gradient(circle at 40% 35%,#8fdcc4,#3f9d86 75%)}.vinyl.o .lab{background:radial-gradient(circle at 40% 35%,#f2c26b,#c58a2e 75%)}
.crate{position:relative;height:244px;overflow:hidden;margin-top:6px}
.crate .vinyl{position:absolute;top:6px}
.shelf{position:absolute;left:0;right:0;bottom:0;height:24px;border-radius:3px;background:linear-gradient(180deg,#b67f4c 0,#9a6638 25%,#7d4f2a 55%,#5a361c 100%);box-shadow:0 7px 14px rgba(0,0,0,.45)}
.shelf:after{content:"";position:absolute;inset:0;background:repeating-linear-gradient(180deg,transparent 0 5px,rgba(50,25,8,.28) 5px 6px)}

.daily{display:flex;align-items:center;gap:11px;padding:10px 11px;margin-top:8px}
.daily .ico{width:38px;height:38px;border-radius:50%;flex:none;display:flex;align-items:center;justify-content:center;background:var(--card2);color:var(--primary)}
.daily b{font:600 14.5px Fraunces,serif}

/* Sheets */
.scrim{position:absolute;inset:0;background:var(--scrim);z-index:4}
.sheet{position:absolute;left:0;right:0;bottom:0;background:var(--sheet);border-radius:26px 26px 0 0;z-index:5;padding:10px 16px 20px}
.handle{width:34px;height:4px;border-radius:2px;background:var(--muted);margin:0 auto 12px}
.opt{display:flex;gap:13px;align-items:center;padding:7px 12px;border:1px solid var(--line);border-radius:8px;margin-top:5px;min-height:51px}
.opt b{display:block;font-size:14px;line-height:1.25}.opt span{font-size:12.5px;color:var(--muted);line-height:1.25;display:block}
.opt.day{background:var(--tonal);border-color:transparent}.opt.day span{color:var(--ontonal);opacity:.85}.opt.day b{color:var(--ontonal)}.opt.day svg{color:var(--ontonal)}
.lane{margin-top:13px}.lane em{display:block;font-style:normal;font:600 15px Fraunces,serif}.lane small{font-size:12px;color:var(--muted)}

.field{height:48px;border:1px solid var(--faint);border-radius:4px;display:flex;align-items:center;padding:0 14px;color:var(--muted)}
.book{border:1px solid var(--line);border-radius:6px;padding:8px 12px;margin-top:7px}.book b{display:block;font-weight:600;font-size:15px}.book span{font-size:12px;color:var(--muted)}
.dev{border-radius:14px;padding:14px;background:linear-gradient(145deg,var(--tonal),var(--card2));color:var(--ontonal)}
.dev h3{font:600 18px/1.2 Fraunces,serif}.dev p{font-size:13px;margin-top:3px;opacity:.9}

.radio{width:20px;height:20px;border-radius:50%;border:2px solid var(--faint);flex:none}.radio.on{border:6px solid var(--primary)}
.chips{display:flex;flex-wrap:wrap;gap:7px;margin-top:8px}
.step{font:600 15px Fraunces,serif;margin:17px 0 7px}
.preview{border-left:3px solid var(--primary);background:var(--card);border-radius:0 10px 10px 0;padding:10px 12px}
.preview b{font:600 16px Fraunces,serif;display:block}

.switch{width:44px;height:26px;border-radius:13px;background:var(--primary);position:relative;flex:none}.switch:after{content:"";position:absolute;right:3px;top:3px;width:20px;height:20px;border-radius:50%;background:var(--onprimary)}
.switch.off{background:var(--card2);outline:1px solid var(--faint)}.switch.off:after{right:auto;left:3px;background:var(--faint)}
.meter{height:5px;border-radius:3px;background:var(--track);margin-top:7px}.meter i{display:block;height:100%;width:13.3%;background:var(--meter);border-radius:3px}
.set{margin-top:9px}.set h3{font:600 15px Fraunces,serif}
.days{display:flex;gap:3px;margin-top:7px}.days span{flex:1;text-align:center;font-size:11px;height:24px;line-height:24px;border-radius:6px;background:var(--chip);color:var(--onchip);font-weight:600}
.lr{display:flex;align-items:center;justify-content:space-between;min-height:37px;border-top:1px solid var(--line);gap:10px}
.slider{height:4px;background:var(--track);border-radius:2px;position:relative;margin:9px 2px 4px}.slider i{position:absolute;left:0;top:0;bottom:0;width:21%;background:var(--primary);border-radius:2px}.slider u{position:absolute;left:21%;top:-7px;width:18px;height:18px;margin-left:-9px;border-radius:50%;background:var(--primary)}

.guide{position:absolute;inset:36px 0 0;padding:6px 24px 34px;display:flex;flex-direction:column}
.skip{align-self:flex-end;color:var(--muted);font-weight:600;padding:8px 2px}
.art{height:380px;margin-top:6px;position:relative;display:flex;align-items:center;justify-content:center}
.guide h1{font:600 30px/1.14 Fraunces,serif;margin-top:8px}.guide p{font-size:16px;line-height:1.45;color:var(--muted);margin-top:10px}
.dots{display:flex;gap:7px;margin-top:auto;margin-bottom:18px;justify-content:center}.dots i{width:8px;height:8px;border-radius:50%;background:var(--line)}.dots i.on{background:var(--primary);width:22px;border-radius:4px}
.gline{display:flex;gap:10px;padding:11px;border:1px solid var(--line);border-radius:10px;align-items:center;width:100%;margin-top:9px;background:var(--card)}
</style></head>
<body>
<div class="intro"><h1>BRIEF-085 — Listen redesign</h1><p>Seven screens at 390×844, in a dark warm library theme, with the app's own Fraunces and Literata fonts. Sample data comes from the device screenshots. Add <code>?theme=paper</code> to see the app's current cream theme.</p></div>
<svg width="0" height="0" style="position:absolute"><defs>
<symbol id="shelf" viewBox="0 0 24 24"><path d="M12 8a2.5 2.5 0 1 0 0-5 2.5 2.5 0 0 0 0 5zM4 10l8 3 8-3v8l-8 3-8-3z"/></symbol>
<symbol id="search" viewBox="0 0 24 24"><circle cx="11" cy="11" r="6.5"/><path d="M16 16l5 5"/></symbol>
<symbol id="bible" viewBox="0 0 24 24"><path d="M12 6c-2-1.500-5-2-8.500-2v14c3.500 0 6.500.5 8.500 2 2-1.500 5-2 8.500-2V4C17 4 14 4.500 12 6zM12 6v14"/></symbol>
<symbol id="rss" viewBox="0 0 24 24"><path d="M5 11a8 8 0 0 1 8 8M5 5a14 14 0 0 1 14 14"/><circle cx="6" cy="18" r="1.400"/></symbol>
<symbol id="phones" viewBox="0 0 24 24"><path d="M4 18v-5a8 8 0 0 1 16 0v5"/><rect x="3.500" y="14" width="4" height="6.500" rx="1.500"/><rect x="16.500" y="14" width="4" height="6.500" rx="1.500"/></symbol>
<symbol id="gear" viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.400 15a1.700 1.700 0 0 0 .3 1.800l.1.100a2 2 0 1 1-2.800 2.800l-.1-.1a1.700 1.700 0 0 0-2.900 1.200V21a2 2 0 0 1-4 0v-.100a1.700 1.700 0 0 0-2.900-1.200l-.1.100a2 2 0 1 1-2.800-2.800l.1-.1a1.700 1.700 0 0 0-1.200-2.900H3a2 2 0 0 1 0-4h.100a1.700 1.700 0 0 0 1.200-2.900l-.1-.1a2 2 0 1 1 2.800-2.800l.1.100a1.700 1.700 0 0 0 1.900.3 1.700 1.700 0 0 0 1-1.500V3a2 2 0 0 1 4 0v.100a1.700 1.700 0 0 0 2.900 1.200l.1-.1a2 2 0 1 1 2.800 2.800l-.1.100a1.700 1.700 0 0 0 1.200 2.900h.100a2 2 0 0 1 0 4h-.100a1.700 1.700 0 0 0-1.500 1z"/></symbol>
<symbol id="plus" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></symbol>
<symbol id="play" viewBox="0 0 24 24"><path d="M7 4l14 8-14 8z"/></symbol>
<symbol id="sun" viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M2 12h2M20 12h2M5 5l1.500 1.500M17.500 17.500L19 19M5 19l1.500-1.500M17.500 6.500L19 5"/></symbol>
<symbol id="moon" viewBox="0 0 24 24"><path d="M20 14.500A8.500 8.500 0 0 1 9.500 4a8.500 8.500 0 1 0 10.500 10.500z"/></symbol>
<symbol id="mark" viewBox="0 0 24 24"><path d="M6 3h12v18l-6-4-6 4z"/></symbol>
<symbol id="globe" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3c3 3 3 15 0 18M12 3c-3 3-3 15 0 18"/></symbol>
<symbol id="chat" viewBox="0 0 24 24"><path d="M4 4h16v13H9l-5 4z"/></symbol>
<symbol id="cal" viewBox="0 0 24 24"><rect x="4" y="5" width="16" height="16" rx="2"/><path d="M4 10h16M8 3v4M16 3v4"/></symbol>
<symbol id="news" viewBox="0 0 24 24"><rect x="4" y="4" width="16" height="16" rx="2"/><path d="M8 9h8M8 13h8M8 17h5"/></symbol>
<symbol id="clock" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></symbol>
<symbol id="back" viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7"/></symbol>
<symbol id="chev" viewBox="0 0 24 24"><path d="M9 5l7 7-7 7"/></symbol>
<symbol id="dots" viewBox="0 0 24 24"><circle cx="12" cy="5" r="1"/><circle cx="12" cy="12" r="1"/><circle cx="12" cy="19" r="1"/></symbol>
</defs></svg>

<div class="wall" id="wall"></div>

<script>
const ic=(n,s='')=>`<svg class="ic" style="${s}"><use href="#${n}"/></svg>`;
const status=(t='7:36')=>`<div class="status"><span>${t}</span><span class="r"><svg width="16" height="12" viewBox="0 0 16 12" fill="currentColor"><path d="M8 12L0 3a12 12 0 0 1 16 0z"/></svg><svg width="12" height="12" viewBox="0 0 12 12" fill="currentColor"><path d="M12 0v12H0z"/></svg><svg width="9" height="13" viewBox="0 0 9 13" fill="currentColor"><path d="M3 0h3v1h3v12H0V1h3z"/></svg></span></div>`;
const nav=on=>`<div class="nav">${[['Shelf','shelf'],['Search','search'],['Bible','bible'],['Sites','rss'],['Listen','phones'],['Settings','gear']].map(([l,i])=>`<div class="${l===on?'on':''}"><i>${ic(i)}</i>${l}</div>`).join('')}</div><div class="gest"></div>`;
const gest='<div class="gest"></div>';
const vinyl=(sz,title,when,cls='',style='')=>`<div class="vinyl ${cls}" style="width:${sz}px;height:${sz}px;${style}"><div class="lab"><b>${title}</b><u></u><span>${when}</span></div></div>`;
const playB=`<div class="play"><svg><use href="#play"/></svg></div>`;

const listen=`${status()}
<div class="body">
  <div class="row" style="height:46px"><h1 class="t grow">Listen</h1><div style="color:var(--muted)">${ic('gear')}</div></div>
  <div class="row" style="padding:7px 0 9px"><div class="vinyl g" style="width:42px;height:42px"><div class="lab" style="inset:32%"></div></div>
    <div class="grow"><div class="tag">Continue listening</div><div class="clip" style="font-weight:600">Fair use benefits everyone</div><div class="small">3 min left</div></div>${playB}</div>
  <div class="row" style="margin-top:3px"><h2 class="s grow">New episodes</h2><span class="sub">22 new</span></div>
  <div class="crate">
    ${vinyl(282,'Input Lag Is So Bad in Ca...','Today 5:45 AM','',"left:8px;")}
    ${vinyl(170,'Fair use benefits...','Today 5:45 AM','g',"left:282px;top:68px;filter:brightness(.62);")}
    <div class="shelf"></div>
  </div>
  <div class="row" style="margin-top:8px"><div class="grow"><div class="clip" style="font:600 16px Fraunces,serif">Input Lag Is So Bad in Call of Duty: Modern...</div><div class="small clip">Today 5:45 AM · 8 min · Deep dive · Downloaded</div></div>${playB}</div>
  <h2 class="s" style="margin-top:12px">Your Daily</h2>
  <div class="card daily"><div class="ico">${ic('sun')}</div><div class="grow"><b>Morning Briefing</b> <span class="sub">6:44 AM</span><div class="small">next: tomorrow 6:44 AM</div></div>${playB}</div>
  <div class="card daily"><div class="ico">${ic('moon')}</div><div class="grow"><b>Evening Devotional</b> <span class="sub">7:00 PM</span><div class="small">next: tonight 7:00 PM</div></div>${playB}</div>
</div>`;

const screens={
A:['A · Listen = Lounge',`${listen}<div class="fab">${ic('plus')}New</div>${nav('Listen')}`],
B:['B · ＋ New sheet',`${listen}${nav('Listen')}<div class="scrim"></div><div class="sheet"><div class="handle"></div><h2 class="s" style="font-size:22px">New</h2>
  <div class="lane" style="margin-top:6px"><em>Make one now</em><small>One episode, one time</small>
   ${[['bible','Bible chapter','A lesson from a Bible chapter'],['shelf','Book','Explore a book from your library'],['mark','Chapter','Talk through one chapter of a book'],['globe','Article','Choose a story from your sites or paste a link'],['chat','Topic','Tell the hosts what interests you']].map(([i,a,b])=>`<div class="opt">${ic(i)}<div><b>${a}</b><span>${b}</span></div></div>`).join('')}</div>
  <div class="lane"><em>Every day</em><small>Arrives on its own at the time you pick</small>
   ${[['cal','Daily devotional from a site',"A Bible lesson from that day's devotion"],['moon','Devotional on a topic','A daily Bible lesson on what you choose'],['news','Daily briefing','The latest from the sites you follow']].map(([i,a,b])=>`<div class="opt day">${ic(i)}<div><b>${a}</b><span>${b}</span></div></div>`).join('')}</div>
  ${gest}</div>`],
C:['C · Bible picker',`<div style="position:absolute;inset:0;background:var(--sheet)">${status()}<div class="body full" style="padding-top:0">
  <div class="handle" style="margin-bottom:6px"></div><h1 class="t" style="font-size:25px">Bible</h1>
  <div class="dev" style="margin-top:9px"><div class="row"><div style="color:var(--primary)">${ic('cal')}</div><h3 class="grow">Make it a daily devotional</h3></div><p>Get a new Bible lesson every day, without picking a chapter each time.</p>
   <div class="row" style="margin-top:10px"><div class="btn sm grow">Today Devotional</div><div class="btn sm line grow">Pick a topic</div></div></div>
  <div class="field" style="margin-top:12px">Search (optional)</div>
  <h3 style="font-size:15px;margin-top:11px">Or make one lesson now</h3>
  <div class="small" style="margin-top:7px;font-weight:600">From your notes &amp; highlights</div>
  <div class="book"><b>John 1:1</b><span>God. · Word highlight</span></div>
  <div class="small" style="margin-top:11px;font-weight:600">Any chapter · Old Testament</div>
  ${[['Genesis',50],['Exodus',40],['Leviticus',27],['Numbers',36],['Deuteronomy',34],['Joshua',24],['Judges',21]].map(([a,n])=>`<div class="book"><b>${a}</b><span>${n} chapters</span></div>`).join('')}
 </div>${gest}</div>`],
D:['D · Start daily devotional',`${status()}<div class="body full">
  <div class="row" style="height:42px;margin-left:-4px">${ic('back')}<span class="grow"></span></div>
  <h1 class="t">Start a daily devotional</h1><div class="sub" style="margin-top:4px;font-size:14px">A new Bible lesson, every day.</div>
  <div class="step">From a site</div>
  <div class="card row"><div class="radio on"></div><div class="grow"><b>Today Devotional</b><div class="small">todaydevotional.com</div></div></div>
  <div class="row" style="margin-top:7px;padding:0 12px;min-height:30px"><div class="radio"></div><div class="grow">Another site</div></div>
  <div class="step">Or a topic</div>
  <div class="chips" style="margin-top:0">${['Anxiety','Marriage','Fatherhood','Faith','Grief','Gratitude'].map(c=>`<span class="chip">${c}</span>`).join('')}</div>
  <div class="step">When</div>
  <div class="card row">${ic('clock','color:var(--primary)')}<div class="grow"><b style="font-size:16px">7:00 PM</b> <span class="sub">every day</span></div><span class="link">Change</span></div>
  <div class="step">Today's devotion</div>
  <div class="preview"><b>Alpha and Omega</b><span class="sub" style="font-size:13.5px">Revelation 22:12-21</span></div>
  <div class="btn" style="position:absolute;left:16px;right:16px;bottom:10px">Start</div>

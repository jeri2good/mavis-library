[build]
  command = "npm ci && npm run build"
  publish = "dist"
  functions = "netlify/functions"

[build.environment]
  NODE_VERSION = "22"

[functions]
  node_bundler = "esbuild"

# Routes are hash-based (#/shelf, #/read/...), so no SPA rewrite is needed.
# Function routes are declared in each function's `config.path` (/api/*).

[[headers]]
  for = "/*"
  [headers.values]
    Content-Security-Policy = "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' blob:; img-src 'self' data: blob: https://www.gutenberg.org https://gutenberg.org https://covers.openlibrary.org https://*.archive.org https://books.google.com https://*.googleusercontent.com; font-src 'self' data: blob:; connect-src 'self' https://api.dictionaryapi.dev https://archive.org https://*.archive.org; frame-src 'self' blob:; worker-src 'self' blob:; media-src 'self' blob: https://*.fish.audio https://archive.org https://*.archive.org; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'; upgrade-insecure-requests"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Content-Type-Options = "nosniff"
    Permissions-Policy = "microphone=(self), camera=(), geolocation=(), payment=()"
    Cross-Origin-Opener-Policy = "same-origin"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "no-cache"

[[headers]]
  for = "/manifest.webmanifest"
  [headers.values]
    Content-Type = "application/manifest+json"
    Cache-Control = "public, max-age=3600"
